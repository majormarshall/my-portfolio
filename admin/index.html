<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin — Bello Abdulwadud Ayomide</title>
  <link rel="stylesheet" href="cms.css">
</head>
<body class="login-page">

  <div class="login-box">
    <div class="login-brand">
      <div class="login-avatar">✦</div>
      <div class="login-name">Bello Abdulwadud Ayomide</div>
      <div class="login-sub">Admin Panel</div>
    </div>

    <form id="login-form" autocomplete="off">
      <div class="field">
        <label>Password</label>
        <div class="field-wrap">
          <input type="password" id="password" placeholder="Enter your password" autofocus>
          <button type="button" class="eye-btn" id="toggle-pw" title="Show / hide">👁</button>
        </div>
      </div>
      <button type="submit" class="btn-login" id="login-btn">Sign in →</button>
    </form>

    <div class="login-msg" id="login-msg"></div>
    <div class="login-attempts" id="login-attempts"></div>
  </div>

  <script src="config.js"></script>
  <script>
    (() => {
      const form      = document.getElementById('login-form');
      const pwInput   = document.getElementById('password');
      const togglePw  = document.getElementById('toggle-pw');
      const loginBtn  = document.getElementById('login-btn');
      const msgEl     = document.getElementById('login-msg');
      const attEl     = document.getElementById('login-attempts');

      let attempts     = parseInt(localStorage.getItem(CMS_CONFIG.ATTEMPTS_KEY) || '0', 10);
      let lockoutUntil = parseInt(localStorage.getItem(CMS_CONFIG.LOCKOUT_KEY)  || '0', 10);
      let countdownId  = null;

      function showMsg(text, type) {
        msgEl.textContent = text;
        msgEl.className   = `login-msg show ${type}`;
      }

      function updateAttempts() {
        const rem = CMS_CONFIG.MAX_ATTEMPTS - attempts;
        attEl.textContent = (attempts > 0 && attempts < CMS_CONFIG.MAX_ATTEMPTS)
          ? `${rem} attempt${rem !== 1 ? 's' : ''} remaining`
          : '';
      }

      async function sha256(str) {
        const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));
        return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
      }

      function startLockout() {
        pwInput.disabled  = true;
        loginBtn.disabled = true;
        attEl.textContent = '';
        if (countdownId) clearInterval(countdownId);
        countdownId = setInterval(() => {
          const ms = lockoutUntil - Date.now();
          if (ms <= 0) {
            clearInterval(countdownId);
            localStorage.removeItem(CMS_CONFIG.LOCKOUT_KEY);
            attempts = 0;
            localStorage.setItem(CMS_CONFIG.ATTEMPTS_KEY, '0');
            lockoutUntil = 0;
            pwInput.disabled  = false;
            loginBtn.disabled = false;
            loginBtn.textContent = 'Sign in →';
            msgEl.className  = 'login-msg';
            attEl.textContent = '';
          } else {
            const m = String(Math.floor(ms / 60000)).padStart(2, '0');
            const s = String(Math.floor((ms % 60000) / 1000)).padStart(2, '0');
            showMsg(`Too many attempts — try again in ${m}:${s}`, 'warning');
          }
        }, 500);
      }

      // On page load
      if (lockoutUntil > Date.now()) {
        startLockout();
      } else {
        updateAttempts();
      }

      // Toggle visibility
      togglePw.addEventListener('click', () => {
        const show = pwInput.type === 'password';
        pwInput.type         = show ? 'text' : 'password';
        togglePw.textContent = show ? '🙈' : '👁';
      });

      // Submit
      form.addEventListener('submit', async e => {
        e.preventDefault();
        if (lockoutUntil > Date.now()) return;
        const val = pwInput.value.trim();
        if (!val) return;

        loginBtn.disabled    = true;
        loginBtn.textContent = 'Verifying…';

        // Check plain-text custom password stored by Settings panel first
        const customPwd = localStorage.getItem(CMS_CONFIG.PWD_KEY || 'cms_custom_password');
        const hash = await sha256(val);
        const hashOfCustom = customPwd ? await sha256(customPwd) : null;

        const isCorrect = (customPwd && val === customPwd)
                       || hash === CMS_CONFIG.PASSWORD_HASH;

        if (isCorrect) {
          localStorage.setItem(CMS_CONFIG.SESSION_KEY, 'true');
          localStorage.setItem(CMS_CONFIG.ATTEMPTS_KEY, '0');
          localStorage.removeItem(CMS_CONFIG.LOCKOUT_KEY);
          showMsg('✓ Welcome back! Redirecting…', 'success');
          setTimeout(() => (window.location.href = 'dashboard.html'), 700);
        } else {
          attempts++;
          localStorage.setItem(CMS_CONFIG.ATTEMPTS_KEY, String(attempts));
          if (attempts >= CMS_CONFIG.MAX_ATTEMPTS) {
            lockoutUntil = Date.now() + CMS_CONFIG.LOCKOUT_MS;
            localStorage.setItem(CMS_CONFIG.LOCKOUT_KEY, String(lockoutUntil));
            startLockout();
          } else {
            loginBtn.disabled    = false;
            loginBtn.textContent = 'Sign in →';
            pwInput.value        = '';
            pwInput.focus();
            updateAttempts();
            showMsg('Incorrect password. Please try again.', 'error');
          }
        }
      });
    })();
  </script>
</body>
</html>
