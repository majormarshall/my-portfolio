<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CMS Login - Bello Abdulwadud Ayomide</title>
  <link rel="stylesheet" href="cms.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>
  <div class="login-wrapper">
    <div class="login-card">
      <h1>Bello Abdulwadud Ayomide — CMS</h1>
      
      <form id="login-form">
        <div class="login-input-group">
          <label for="password">Enter Admin Password</label>
          <div class="login-input-wrapper">
            <input type="password" id="password" placeholder="Password" required>
            <button type="button" class="password-toggle" id="toggle-password" title="Toggle visibility">👁</button>
          </div>
        </div>
        
        <button type="submit" class="login-btn" id="login-btn">Login</button>
        
        <div class="login-message" id="login-message"></div>
      </form>
    </div>
  </div>

  <script src="config.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const form = document.getElementById('login-form');
      const passwordInput = document.getElementById('password');
      const toggleBtn = document.getElementById('toggle-password');
      const msgDiv = document.getElementById('login-message');
      const loginBtn = document.getElementById('login-btn');

      // Check if already logged in (redirect not required but good UX, though prompt says DO NOT redirect if already logged in, so we skip redirect here)
      // "DO NOT redirect if already logged in (let them re-authenticate if they open login page directly)"

      // Load rate limiting data
      let attempts = parseInt(localStorage.getItem(CMS_CONFIG.ATTEMPTS_KEY) || '0', 10);
      let lockoutUntil = parseInt(localStorage.getItem(CMS_CONFIG.LOCKOUT_KEY) || '0', 10);
      let timerInterval;

      function updateLockoutUI() {
        const now = Date.now();
        if (lockoutUntil > now) {
          passwordInput.disabled = true;
          loginBtn.disabled = true;
          
          if (timerInterval) clearInterval(timerInterval);
          
          timerInterval = setInterval(() => {
            const current = Date.now();
            const remaining = lockoutUntil - current;
            if (remaining <= 0) {
              clearInterval(timerInterval);
              localStorage.removeItem(CMS_CONFIG.LOCKOUT_KEY);
              attempts = 0;
              localStorage.setItem(CMS_CONFIG.ATTEMPTS_KEY, '0');
              lockoutUntil = 0;
              passwordInput.disabled = false;
              loginBtn.disabled = false;
              msgDiv.textContent = '';
              msgDiv.className = 'login-message';
            } else {
              const minutes = Math.floor(remaining / 60000);
              const seconds = Math.floor((remaining % 60000) / 1000);
              msgDiv.textContent = `Locked out. Try again in ${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
              msgDiv.className = 'login-message text-danger';
            }
          }, 1000);
          return true;
        }
        return false;
      }

      updateLockoutUI();

      toggleBtn.addEventListener('click', () => {
        if (passwordInput.type === 'password') {
          passwordInput.type = 'text';
          toggleBtn.textContent = '🙈';
        } else {
          passwordInput.type = 'password';
          toggleBtn.textContent = '👁';
        }
      });

      async function hashPassword(password) {
        const encoder = new TextEncoder();
        const data = encoder.encode(password);
        const hashBuffer = await crypto.subtle.digest('SHA-256', data);
        const hashArray = Array.from(new Uint8Array(hashBuffer));
        return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
      }

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        
        if (updateLockoutUI()) return;

        const pwd = passwordInput.value;
        if (!pwd) return;

        const hash = await hashPassword(pwd);

        if (hash === CMS_CONFIG.PASSWORD_HASH) {
          // Success
          localStorage.setItem(CMS_CONFIG.SESSION_KEY, 'true');
          localStorage.setItem(CMS_CONFIG.ATTEMPTS_KEY, '0');
          localStorage.removeItem(CMS_CONFIG.LOCKOUT_KEY);
          msgDiv.textContent = 'Success! Redirecting...';
          msgDiv.className = 'login-message';
          msgDiv.style.color = '#2ecc71';
          setTimeout(() => {
            window.location.href = 'dashboard.html';
          }, 500);
        } else {
          // Failure
          attempts++;
          localStorage.setItem(CMS_CONFIG.ATTEMPTS_KEY, attempts.toString());
          
          if (attempts >= CMS_CONFIG.MAX_ATTEMPTS) {
            lockoutUntil = Date.now() + CMS_CONFIG.LOCKOUT_MS;
            localStorage.setItem(CMS_CONFIG.LOCKOUT_KEY, lockoutUntil.toString());
            updateLockoutUI();
          } else {
            const remaining = CMS_CONFIG.MAX_ATTEMPTS - attempts;
            msgDiv.textContent = `Invalid password. ${remaining} attempt(s) remaining.`;
            msgDiv.className = 'login-message text-warning';
            passwordInput.value = '';
            passwordInput.focus();
          }
        }
      });
    });
  </script>
</body>
</html>
